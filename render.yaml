envVarGroups:
  - name: shadowtest-shared
    envVars:
      - key: INTERNAL_API_KEY
        generateValue: true

services:
  - type: redis
    name: shadowtest-redis
    plan: starter
    ipAllowList: []

  - type: web
    name: shadowtest-api
    runtime: node
    plan: starter
    rootDir: api
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run migrate:deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - fromGroup: shadowtest-shared
      - key: POSTGRES_PRISMA_URL
        sync: false
      - key: POSTGRES_URL_NON_POOLING
        sync: false
      - key: CLERK_ISSUER_URL
        sync: false
      - key: CLERK_JWT_AUDIENCE
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      - key: AI_ENGINE_URL
        value: http://shadowtest-ai-engine:8000
      - key: REDIS_URL
        fromService:
          type: redis
          name: shadowtest-redis
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_STARTER_PRICE_ID
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false

  - type: web
    name: shadowtest-ai-engine
    runtime: python
    plan: starter
    rootDir: ai-engine
    buildCommand: pip install -r requirements.txt && playwright install --with-deps chromium
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PORT
        value: 8000
      - key: APP_ENV
        value: production
      - key: API_URL
        value: http://shadowtest-api:4000/api
      - fromGroup: shadowtest-shared
      - key: REDIS_URL
        fromService:
          type: redis
          name: shadowtest-redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false

  - type: worker
    name: shadowtest-simulation-worker
    runtime: python
    plan: starter
    rootDir: ai-engine
    buildCommand: pip install -r requirements.txt && playwright install --with-deps chromium
    startCommand: python worker.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: API_URL
        value: http://shadowtest-api:4000/api
      - fromGroup: shadowtest-shared
      - key: REDIS_URL
        fromService:
          type: redis
          name: shadowtest-redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
